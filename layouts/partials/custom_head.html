{{- /* Arabic posts: flip the content column to right-to-left. */ -}}
{{- if or .Params.rtl (eq (partial "page-language.html" .) "ar") (findRE `[\x{0600}-\x{06FF}]` .Title) }}
<style>
  main { direction: rtl; text-align: right; }
  main pre, main code { direction: ltr; text-align: left; }
</style>
{{- end }}


<style>
  main img { height: auto; }
  main figure { margin-inline: 0; }
  main pre { overflow-x: auto; }
  main pre code { white-space: pre; overflow-wrap: normal; word-break: normal; }
</style>
